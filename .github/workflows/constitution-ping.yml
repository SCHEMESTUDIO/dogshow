# Dog Show → Postwerks: when constitution/ changes, nudge the
# constitution-sync workflow in SCHEMESTUDIO/postwerks so the mirror + drift
# check run within minutes instead of waiting for the daily 07:45 UTC pass.
#
# Needs secret POSTWERKS_DISPATCH_TOKEN: a fine-grained PAT with
# contents:read+write (for repository_dispatch) on SCHEMESTUDIO/postwerks.
# Without it this is a logged no-op — the daily mirror still catches up.
name: constitution-ping

on:
  push:
    branches: [main]
    paths: ["constitution/**"]

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # secrets can't appear in step `if:` (parse-fails the file — learned
      # 2026-07-04); env-indirection + a shell guard instead.
      DISPATCH_TOKEN: ${{ secrets.POSTWERKS_DISPATCH_TOKEN }}
    steps:
      - name: repository_dispatch → SCHEMESTUDIO/postwerks
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "POSTWERKS_DISPATCH_TOKEN not set — skipping (daily mirror will pick this up)"
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/SCHEMESTUDIO/postwerks/dispatches \
            -d '{"event_type":"constitution-updated","client_payload":{"site":"dogshow"}}'
